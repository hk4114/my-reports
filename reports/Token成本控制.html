"cache-row\">\n        \u003cdiv class=\"node prefix-node\">系统提示词 / Tool 定义 / 项目背景\u003c/div>\n        \u003cdiv class=\"arrow-h\">\u003c/div>\n        \u003cdiv class=\"note-node\">本轮问题 B\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003cp>这里有三个很关键的推论。\u003c/p>\u003cp>\u003cstrong>第一，它省的不是首次成本，而是重复成本。\u003c/strong> 第一次发送长前缀时，通常还是要正常付费；价值在第二次、第三次以及后续很多次复用时才会体现出来。\u003c/p>\u003cp>\u003cstrong>第二，缓存不是\"写短\"，而是\"写稳\"。\u003c/strong> 你天天改系统提示词、天天调 Skill Prompt，那缓存理论上存在，实践里也很难命中。\u003c/p>\u003cp>\u003cstrong>第三，缓存优化和上下文治理是一回事。\u003c/strong> 减少前缀抖动、把稳定内容前置、把变化内容后置，本质都在提升\"可复用比例\"。\u003c/p>\u003cp>所以 Prompt Cache 本质上不是让模型更聪明，而是让你别为同一段前缀反复买单。OpenAI 与 Anthropic 都提到，长前缀命中缓存后，输入成本和延迟都可能显著下降。[1][2][3]\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Token 优化重点，不是把提示词写短，而是把前缀写稳。\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>（缓存怎么落地，和第四章的 headroom、Session 治理直接相关，后面会展开。）\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-5\">\u003ch3 class=\"sec-title\">1.5 一张全图：五层模型\u003c/h3>\u003cp>梳理完成本来源后，再看优化路径就会清楚很多。\u003c/p>\u003cp>这篇文章的核心框架分五层：\u003c/p>\u003cdiv class=\"layer-stack\">\n      \u003cdiv class=\"layer-scale\">\u003cspan>便宜 · 立刻可做\u003c/span>\u003ci>\u003c/i>\u003cspan>贵 · 系统级\u003c/span>\u003c/div>\n      \u003ca class=\"layer-row\" href=\"#ch-2\" data-reveal>\n        \u003cspan class=\"layer-num\">01\u003c/span>\n        \u003cspan class=\"layer-name\">使用习惯\u003c/span>\n        \u003cspan class=\"layer-role\">先减少无意义的上下文\u003c/span>\n        \u003cspan class=\"layer-feat\">零成本，立刻可做\u003c/span>\n        \u003cspan class=\"layer-go\">→\u003c/span>\n      \u003c/a>\u003ca class=\"layer-row\" href=\"#ch-3\" data-reveal>\n        \u003cspan class=\"layer-num\">02\u003c/span>\n        \u003cspan class=\"layer-name\">模型路由\u003c/span>\n        \u003cspan class=\"layer-role\">让不同任务匹配不同模型\u003c/span>\n        \u003cspan class=\"layer-feat\">ROI 最高\u003c/span>\n        \u003cspan class=\"layer-go\">→\u003c/span>\n      \u003c/a>\u003ca class=\"layer-row\" href=\"#ch-4\" data-reveal>\n        \u003cspan class=\"layer-num\">03\u003c/span>\n        \u003cspan class=\"layer-name\">Context 工程 / 压缩工具\u003c/span>\n        \u003cspan class=\"layer-role\">稳定前缀、把必进上下文的内容压短\u003c/span>\n        \u003cspan class=\"layer-feat\">装完即用，立即见效\u003c/span>\n        \u003cspan class=\"layer-go\">→\u003c/span>\n      \u003c/a>\u003ca class=\"layer-row\" href=\"#ch-5\" data-reveal>\n        \u003cspan class=\"layer-num\">04\u003c/span>\n        \u003cspan class=\"layer-name\">代码图谱\u003c/span>\n        \u003cspan class=\"layer-role\">让检索不再盲搜、缩短检索链路\u003c/span>\n        \u003cspan class=\"layer-feat\">系统级优化\u003c/span>\n        \u003cspan class=\"layer-go\">→\u003c/span>\n      \u003c/a>\u003ca class=\"layer-row\" href=\"#ch-6\" data-reveal>\n        \u003cspan class=\"layer-num\">05\u003c/span>\n        \u003cspan class=\"layer-name\">Agent 架构\u003c/span>\n        \u003cspan class=\"layer-role\">把任务分给对的单元，拆开上下文\u003c/span>\n        \u003cspan class=\"layer-feat\">提升长期可维护性\u003c/span>\n        \u003cspan class=\"layer-go\">→\u003c/span>\n      \u003c/a>\n    \u003c/div>\u003cp>它们不是并列的小技巧，而是一条从便宜到贵、从易到难的升级路径：\u003c/p>\u003cul class=\"lst\">\u003cli>\u003cstrong>使用习惯\u003c/strong>解决的是\"无意义的历史和废 Token\"\u003c/li>\u003cli>\u003cstrong>模型路由\u003c/strong>解决的是\"贵模型干便宜活\"\u003c/li>\u003cli>\u003cstrong>Context 工程\u003c/strong>解决的是\"同样前缀/相同内容重复传输\"\u003c/li>\u003cli>\u003cstrong>代码图谱\u003c/strong>解决的是\"每次都从零找代码\"\u003c/li>\u003cli>\u003cstrong>Agent 架构\u003c/strong>解决的是\"所有任务都塞给同一个大上下文\"\u003c/li>\u003c/ul>\u003cp>这五层背后只有一个总目标：\u003c/p>\u003cul class=\"lst\">\u003cli>让模型少看无关内容\u003c/li>\u003cli>让便宜模型多干标准活\u003c/li>\u003cli>让贵模型只做高价值推理\u003c/li>\u003c/ul>\u003cp>还有一条贯穿全文的线：\u003cstrong>观测与预算治理\u003c/strong>。\u003c/p>\u003cp>没有数据，优化就会变成体感。你觉得自己\"省了\"，但不知道省在哪，也不知道是不是用质量换的。这条线到第三章 3.6 和第四章的统计命令里，会一再出现。\u003c/p>\u003cp>到这里，第一章真正想建立的心智模型可以浓缩成一句话：\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>AI Coding Agent 的成本，本质上不是\"你问了什么\"，而是\"系统为了回答你，重复搬运了多少上下文\"。\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>一旦你脑子里有了这张图，第二章那些\"看起来很琐碎\"的使用习惯，就不再是经验技巧，而会变成非常自然的工程动作。\u003c/p>\u003c/section>\u003cheader class=\"chapter-head\" data-sec data-reveal>\n    \u003cspan class=\"eyebrow\">第 二 章\u003c/span>\n    \u003ch2 id=\"ch-2\" class=\"chapter-title\">使用习惯：最便宜也是最被低估的优化\u003c/h2>\n  \u003c/header>\u003cp>如果你现在就要开始省 Token，最先动的不是架构，不是知识图谱，而是使用习惯。\u003c/p>\u003cp>这一层几乎零工程投入，却经常拿到第一波最大收益。接下来的九个习惯，都是今天就能改的。\u003c/p>\u003csection class=\"sec\" data-sec id=\"sec-6\">\u003ch3 class=\"sec-title\">2.1 一个 Session，一件事\u003c/h3>\u003cp>很多人把 AI Agent 当成永不关闭的长会话：上午修 Bug，下午写文档，晚上聊架构，第二天接着来。\u003c/p>\u003cp>体验很顺，成本是灾难。\u003c/p>\u003cp>原因很简单：Session 越长 → 继承的历史越多 → 每一轮越贵。\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>一个 Session 只服务一个目标。\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>修 Bug 开一个，做重构开一个，写文章开一个，查线上问题开一个。别混着来，Topic 切分就是最便宜的 Context 管理。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-7\">\u003ch3 class=\"sec-title\">2.2 长会话不压缩，就是负债\u003c/h3>\u003cp>很多人舍不得清历史，觉得\"越完整越稳\"。\u003c/p>\u003cp>模型不需要你的完整试错过程，它需要的是：\u003c/p>\u003cul class=\"lst\">\u003cli>现在要干什么\u003c/li>\u003cli>做完了什么\u003c/li>\u003cli>哪条路不通\u003c/li>\u003cli>卡在哪了\u003c/li>\u003cli>下一步怎么做\u003c/li>\u003c/ul>\u003cp>\u003ccode>/compact\u003c/code> 做的，本质上就是这一件事：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"把完整历史\n压成可继续工作的状态\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>把完整历史\n压成可继续工作的状态\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>对话记录不是资产，未压缩的长对话是负债。它让后续每一轮都背着越来越重的历史包袱。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-8\">\u003ch3 class=\"sec-title\">2.3 聊天记录不是数据库\u003c/h3>\u003cp>很多团队把背景、决策、约束、待办全挂在会话里，指望 Agent 一路记到底。\u003c/p>\u003cp>后果：会话越来越长，状态越来越难提炼，成本越来越高。\u003c/p>\u003cp>真正该长期保留的信息，外置出去：\u003c/p>\u003cul class=\"lst\">\u003cli>项目文档\u003c/li>\u003cli>Summary 文件\u003c/li>\u003cli>Memory 文件\u003c/li>\u003cli>Repo Map / 知识图谱\u003c/li>\u003cli>任务清单\u003c/li>\u003c/ul>\u003cp>让会话只承载\"当前工作状态\"，而不是全部项目历史。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-9\">\u003ch3 class=\"sec-title\">2.4 少说废话，也是省 Token\u003c/h3>\u003cp>很多人优化只盯输入，忘了输出一样贵。\u003c/p>\u003cp>编码场景最浪费的回答不是\"错\"，是\"废\"：先复述一遍问题，再讲一段众所周知的背景，然后一堆礼貌性铺垫，最后才给结论。\u003c/p>\u003cp>如果你只需要 diff、步骤、结论、表格、JSON——直接要求它这么给。\u003c/p>\u003cp>这类约束值钱，因为它同时省两类：\u003c/p>\u003col class=\"lst\">\u003cli>输出更短\u003c/li>\u003cli>结果更可用 → 重试更少\u003c/li>\u003c/ol>\u003cp>在很多日常任务里，一句指令就够了：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"直接给结论，不要复述问题，必要时再展开\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>直接给结论，不要复述问题，必要时再展开\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>Caveman 这类思路受欢迎（见 4.2），不是因为它\"简陋\"，而是直接打掉高频废 Token。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-10\">\u003ch3 class=\"sec-title\">2.5 Skill ≠ 免费能力\u003c/h3>\u003cp>Skill 有价值，但也背成本。\u003c/p>\u003cp>每个 Skill 都带着 Description、Instructions、Examples、触发逻辑。这些信息如果常驻，就会进上下文。\u003c/p>\u003cp>问题不是\"装不装\"，而是：\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>哪些常驻，哪些按需加载。\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>高频、稳定、通用的 Skill 常驻；低频、长说明、低复用的按需触发。和后端服务治理同理：常驻能力要尽量少而精。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-11\">\u003ch3 class=\"sec-title\">2.6 MCP 越多，不一定越强\u003c/h3>\u003cp>MCP 的最大诱惑是让 Agent \"什么都能接\"。\u003c/p>\u003cp>但从成本看，每多一个 MCP，就多一份 Tool Definition、多一层选择成本。\u003c/p>\u003cp>很多人装了 GitHub、Notion、Jira、Slack、Browser、Filesystem、Kubernetes、Docker 和各种内部系统。看起来很强，实际高频用的就两三个。\u003c/p>\u003cp>工具太多不只是\"文档长\"的问题：\u003c/p>\u003cul class=\"lst\">\u003cli>选择空间变大 → 决策变慢\u003c/li>\u003cli>错误调用概率变高\u003c/li>\u003cli>每轮携带定义更重\u003c/li>\u003c/ul>\u003cp>所以工具治理和依赖治理一样：关键不是能不能装，是有没有必要常驻。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-12\">\u003ch3 class=\"sec-title\">2.7 CLI 优先于 MCP\u003c/h3>\u003cp>这是一个有点尖锐但很实用的原则：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"能 CLI 解决 → 尽量 CLI\n能脚本解决 → 尽量脚本\n最后才考虑 MCP\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>能 CLI 解决 → 尽量 CLI\n能脚本解决 → 尽量脚本\n最后才考虑 MCP\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>很多操作已经有非常成熟的 CLI：\u003ccode>gh pr create\u003c/code>、\u003ccode>kubectl get pods\u003c/code>、\u003ccode>docker ps\u003c/code>、\u003ccode>git diff\u003c/code>。AI 直接走命令更轻，不需要额外拉一整套工具说明。\u003c/p>\u003cp>对于国内常见的研发平台，也有专门为 AI Agent 优化的 CLI 工具可以直接用：\u003c/p>\u003cul class=\"lst\">\u003cli>\u003ca href=\"https://github.com/studyzy/tapd-ai-cli\" target=\"_blank\" rel=\"noopener\">\u003cstrong>tapd-ai-cli\u003c/strong>\u003c/a>：腾讯 TAPD 的 AI Agent 专用 CLI，支持需求、缺陷、任务的查询和更新。直接用 \u003ccode>tapd story list\u003c/code>、\u003ccode>tapd bug create\u003c/code> 之类的命令操作 TAPD，比拉一套 MCP 轻得多，还能用 \u003ccode>tapd skill init\u003c/code> 一键生成 SKILL.md 配置。\u003c/li>\u003cli>\u003ca href=\"https://github.com/studyzy/gongfeng-cli\" target=\"_blank\" rel=\"noopener\">\u003cstrong>gongfeng-cli\u003c/strong>\u003c/a>：腾讯工蜂代码托管的 AI Agent 专用 CLI，专门针对 Agent 的认知模式优化了输出格式（Markdown + JSON 混合），支持 PR 创建、代码评审、项目管理等完整工作流，Token 消耗显著低于同等 MCP 方案。\u003c/li>\u003c/ul>\u003cp>这两个工具的共同思路值得借鉴：\u003cstrong>专为 Agent 设计，而不是给人看的 UI 套了个 CLI 壳\u003c/strong>。输出格式、信息密度、命令发现机制，都针对 AI 的调用模式做了优化。\u003c/p>\u003cp>MCP 的价值在于：跨系统编排、结构化返回、权限统一收敛、内部业务能力包装。\u003c/p>\u003cp>所以不是\"CLI 永远优于 MCP\"，而是：\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>已有成熟命令链路时，不要为了看起来高级而过度工具化。\u003c/strong>\u003c/p>\u003c/blockquote>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-13\">\u003ch3 class=\"sec-title\">2.8 引用文件时带完整路径\u003c/h3>\u003cp>这是一个极其容易忽视的小习惯，但省的 Token 实实在在。\u003c/p>\u003cp>很多人引用文件时习惯只写文件名：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"看一下 config.go 的问题\n帮我修改 utils.py\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>看一下 config.go 的问题\n帮我修改 utils.py\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>AI 收到这类请求，往往要先搜索整个项目找这个文件在哪，有时候还会搜到同名文件或路径不确定，再次搜索确认。这些搜索调用和返回结果，全部计入 Token。\u003c/p>\u003cp>更直接的做法：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"看一下 src/config/config.go 的问题\n帮我修改 @/Users/yourname/project/utils.py\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>看一下 src/config/config.go 的问题\n帮我修改 @/Users/yourname/project/utils.py\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>用 \u003ccode>@\u003c/code> 符号加上相对路径或绝对路径，Agent 直接定位读取，不需要搜索任何中间步骤。\u003c/p>\u003cp>这个习惯对大型项目更显著——项目越大，搜索代价越高，目录层级越深，搜索越容易绕弯：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"只写文件名 → 搜索 → 可能多次确认 → 读取\n完整路径   → 直接读取\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>只写文件名 → 搜索 → 可能多次确认 → 读取\n完整路径   → 直接读取\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>一个 \u003ccode>@路径\u003c/code> 节省的，是一整条搜索链路。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-14\">\u003ch3 class=\"sec-title\">2.9 把意图一次说完，别聊天式拆碎\u003c/h3>\u003cp>AI Agent 的使用场景里，有一种很常见的低效模式：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"用户：帮我看一下这个函数\nAI  ：你想让我做什么？\n用户：找一下有没有 bug\nAI  ：找到一个问题，要修吗？\n用户：修一下\nAI  ：修好了，还要写测试吗？\n用户：写一下\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>用户：帮我看一下这个函数\nAI  ：你想让我做什么？\n用户：找一下有没有 bug\nAI  ：找到一个问题，要修吗？\n用户：修一下\nAI  ：修好了，还要写测试吗？\n用户：写一下\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>表面上看是\"正常沟通\"，实际上每一轮来回都在消耗 Token：重新组装上下文、重新带入历史、重新确认状态。四轮对话的成本，往往是一次完整表达的好几倍。\u003c/p>\u003cp>更省的做法是一次把意图说清楚：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"看 @src/order/service.go 的 CreateOrder 函数，\n找出潜在的 bug，修复，并为修复后的函数写单测。\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>看 @src/order/service.go 的 CreateOrder 函数，\n找出潜在的 bug，修复，并为修复后的函数写单测。\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>这不是要求你写得长，而是要求你\u003cstrong>把目标说完整\u003c/strong>。一次对话，Agent 一次性跑完整个任务，省去了所有中间确认的来回成本。\u003c/p>\u003cp>越具体、越完整的指令，浪费的轮次越少。这和程序员提 Issue 的逻辑是一样的：把背景、期望、验收条件都写清楚，沟通成本才不会比写代码还贵。\u003c/p>\u003c/section>\u003cheader class=\"chapter-head\" data-sec data-reveal>\n    \u003cspan class=\"eyebrow\">第 三 章\u003c/span>\n    \u003ch2 id=\"ch-3\" class=\"chapter-title\">模型路由：别让贵模型干便宜活\u003c/h2>\n  \u003c/header>\u003cp>习惯层做好之后，下一步收益最高的，是模型路由。\u003c/p>\u003cp>很多人一上来就犯一个错：所有环节默认最强模型。看起来稳，实际上最烧钱。\u003c/p>\u003csection class=\"sec\" data-sec id=\"sec-15\">\u003ch3 class=\"sec-title\">3.1 匹配优先，不是便宜优先\u003c/h3>\u003cp>模型路由不是\"一律用便宜的\"，而是先把任务类型分对：\u003c/p>\u003cul class=\"lst\">\u003cli>复杂任务 → 强模型\u003c/li>\u003cli>简单任务 → 便宜模型\u003c/li>\u003cli>重复任务 → 稳定模型\u003c/li>\u003c/ul>\u003cp>架构设计需要长链路推理，该用贵的就用。写单测、补注释、生成提交信息的，便宜模型完全够用。大规模批量分类和摘要，适合低单价模型或离线批处理。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-16\">\u003ch3 class=\"sec-title\">3.2 一张表说清楚\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>任务\u003c/th>\u003cth>推荐模型档位\u003c/th>\u003cth>理由\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>写 UT\u003c/td>\u003ctd class=\"num\">便宜模型\u003c/td>\u003ctd class=\"num\">模式稳定、模板化\u003c/td>\u003c/tr>\u003ctr>\u003ctd>写 commit\u003c/td>\u003ctd class=\"num\">便宜模型\u003c/td>\u003ctd class=\"num\">输出短、风险低\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Code Review\u003c/td>\u003ctd class=\"num\">中高档模型\u003c/td>\u003ctd class=\"num\">需要语义理解\u003c/td>\u003c/tr>\u003ctr>\u003ctd>架构设计\u003c/td>\u003ctd class=\"num\">强模型\u003c/td>\u003ctd class=\"num\">长链路推理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复杂 Bug 分析\u003c/td>\u003ctd class=\"num\">强模型\u003c/td>\u003ctd class=\"num\">多步假设和验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>批量分类/摘要\u003c/td>\u003ctd class=\"num\">低价或 Batch\u003c/td>\u003ctd class=\"num\">规模大、成本敏感\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>选模型不是凭喜好，是按任务需要的能力。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-17\">\u003ch3 class=\"sec-title\">3.3 先过便宜模型，再升级\u003c/h3>\u003cp>很多任务不需要一上来就最贵模型。\u003c/p>\u003cp>更省的模式可以简化成一条升级链路：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"便宜模型先跑\n↓\n判断复杂度\n↓\n需要才升级\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>便宜模型先跑\n↓\n判断复杂度\n↓\n需要才升级\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>例如：先让便宜模型分类（重构？Bug？文档？），先做初筛（PR 有没有高风险？），先做摘要（20 页 → 1 页），再交给强模型做推理。\u003c/p>\u003cp>这种级联工作流，既省钱，又让贵模型花在刀刃上。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-18\">\u003ch3 class=\"sec-title\">3.4 不只换模型，也要调预算旋钮\u003c/h3>\u003cp>现在很多模型提供成本旋钮：\u003c/p>\u003cul class=\"lst\">\u003cli>\u003ccode>reasoning effort\u003c/code>\u003c/li>\u003cli>\u003ccode>thinking budget\u003c/code>\u003c/li>\u003cli>\u003ccode>verbosity\u003c/code>\u003c/li>\u003cli>\u003ccode>max output tokens\u003c/code>\u003c/li>\u003c/ul>\u003cp>它们影响的，其实是同一组东西：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"想多深、答多长、花多少钱\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>想多深、答多长、花多少钱\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>Google Gemini 的 \u003ccode>thinkingBudget\u003c/code> 允许按任务控制思考 Token，简单任务甚至可以压到 0（关闭思考）。OpenAI 也建议很多工作负载从 \u003ccode>low\u003c/code> 的 reasoning effort 起步。\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>不是所有任务都要深度思考，也不是所有任务都要长答案。\u003c/strong> 让一个模型用高推理档位做分类、摘要、提交说明，本质上是在拿推土机扫地。\u003c/p>\u003c/blockquote>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-19\">\u003ch3 class=\"sec-title\">3.5 Skill / Agent / Command 都应该绑定模型\u003c/h3>\u003cp>模型路由不该只存在于\"主对话框\"的心智里，要落实到执行单元。\u003c/p>\u003cp>\u003cstrong>Skill 绑定模型\u003c/strong>：写 UT、commit、格式修复、样板代码，明确绑定便宜模型。\u003c/p>\u003cp>以 CodeBuddy 为例，SKILL.md 文件头部可以直接声明模型和上下文策略：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">yaml\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"---\nname: write-unit-tests\ndescription: 为指定函数生成单元测试\ncontext: fork\nmodel: deepseek-v4-pro\n---\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>---\nname: write-unit-tests\ndescription: 为指定函数生成单元测试\ncontext: fork\nmodel: deepseek-v4-pro\n---\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>\u003ccode>model\u003c/code> 字段指定该 Skill 使用的模型；\u003ccode>context: fork\u003c/code> 表示把这类固定流程放到独立执行上下文里，适合任务边界清晰、可单独完成的 Skill。这样一来，低复杂度的 Skill 就能自动走便宜模型，也不必把主会话的全部历史都带进去。\u003c/p>\u003cp>斜杠命令（Slash Command）和 Agent 同样支持模型参数绑定，在定义时就固化好模型选择。这样团队里每个人用 \u003ccode>/commit\u003c/code>、\u003ccode>/gen-ut\u003c/code> 这类命令时，都默认走便宜模型，不需要依赖个人记得切换。\u003c/p>\u003cp>\u003cstrong>Agent 绑定模型\u003c/strong>：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"Planner  → 中高档\nCoder    → 中档 / 便宜\nReviewer → 强\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>Planner  → 中高档\nCoder    → 中档 / 便宜\nReviewer → 强\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>\u003cstrong>Command 绑定模型\u003c/strong>：很多命令本身就是固定模板，适合预设便宜模型。\u003c/p>\u003cp>这类设计一旦固化，成本治理就从\"靠人记得切\"变成\"系统默认更省\"。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-20\">\u003ch3 class=\"sec-title\">3.6 观测与预算治理：把体感变成数据\u003c/h3>\u003cp>前面全是\"该怎么省\"，这一节讲\"怎么知道省了多少\"。\u003c/p>\u003cp>先建立最简单的三件套：\u003c/p>\u003col class=\"lst\">\u003cli>\u003cstrong>每个模型有单价基线\u003c/strong>：输入/输出的单价 × 实际 Token 量，是一切优化的参照。\u003c/li>\u003cli>\u003cstrong>重试率是隐藏成本源\u003c/strong>：同一任务重跑的次数，直接把单次成本翻倍。\u003c/li>\u003cli>\u003cstrong>用好工具的统计命令\u003c/strong>：第四章的工具几乎都自带统计——\u003ccode>rtk gain\u003c/code> 看命令输出压缩了多少，\u003ccode>headroom_stats\u003c/code> 看压缩率，context-mode 的 \u003ccode>/ctx-stats\u003c/code> 按工具分类看节省。\u003c/li>\u003c/ol>\u003cp>更进一步，给 Token、成本、重试率、工具调用次数建观测面板，按任务、按模型、按工具分类。省没省、省在哪，数据说话，而不是靠体感。\u003c/p>\u003c/section>\u003cheader class=\"chapter-head\" data-sec data-reveal>\n    \u003cspan class=\"eyebrow\">第 四 章\u003c/span>\n    \u003ch2 id=\"ch-4\" class=\"chapter-title\">上下文压缩：先把高频上下文压下来\u003c/h2>\n  \u003c/header>\u003cp>如果说前三章解决的是\"少带无关上下文\"，这一层解决的就是另一件事：\u003cstrong>把那些一定会进上下文的内容，尽量压短。\u003c/strong>\u003c/p>\u003cp>这四个工具方向不同，但可以叠加。你不一定要一次装全，但只要装上一个，通常就能立刻看到收益。\u003c/p>\u003csection class=\"sec\" data-sec id=\"sec-21\">\u003ch3 class=\"sec-title\">4.1 RTK：终端输出才是真正的 Token 大杀手\u003c/h3>\u003cp>很多人把 Token 浪费归因于\"聊太多轮\"，但忽略了一个隐性大户：\u003cstrong>终端命令的冗余输出\u003c/strong>。\u003c/p>\u003cp>Agent 执行 \u003ccode>cargo test\u003c/code>，成千上万行测试日志、警告、进度条、ANSI 颜色码全部涌进上下文。\u003c/p>\u003cp>\u003cstrong>实测\u003c/strong>：30 分钟开发会话对比（来自 2900+ 真实命令测量）：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>场景\u003c/th>\u003cth>Token 消耗\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>不用 RTK\u003c/td>\u003ctd class=\"num\">≈150,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>用 RTK\u003c/td>\u003ctd class=\"num\">≈16,850\u003c/td>\u003c/tr>\u003ctr>\u003ctd>节省\u003c/td>\u003ctd class=\"num\">\u003cstrong>88.9%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>按命令类别的典型压缩率：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>命令类别\u003c/th>\u003cth>原始 tokens\u003c/th>\u003cth>RTK 后\u003c/th>\u003cth>节省\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>cargo test / npm test\u003c/td>\u003ctd class=\"num\">25,000\u003c/td>\u003ctd class=\"num\">2,500\u003c/td>\u003ctd class=\"num\">-90%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>pytest\u003c/td>\u003ctd class=\"num\">8,000\u003c/td>\u003ctd class=\"num\">800\u003c/td>\u003ctd class=\"num\">-90%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>vitest run\u003c/td>\u003ctd class=\"num\">102,199 字符\u003c/td>\u003ctd class=\"num\">377 字符\u003c/td>\u003ctd class=\"num\">-99.6%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ls / tree\u003c/td>\u003ctd class=\"num\">2,000\u003c/td>\u003ctd class=\"num\">400\u003c/td>\u003ctd class=\"num\">-80%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>grep / rg\u003c/td>\u003ctd class=\"num\">16,000\u003c/td>\u003ctd class=\"num\">3,200\u003c/td>\u003ctd class=\"num\">-80%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>git status\u003c/td>\u003ctd class=\"num\">3,000\u003c/td>\u003ctd class=\"num\">600\u003c/td>\u003ctd class=\"num\">-80%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>git diff\u003c/td>\u003ctd class=\"num\">10,000\u003c/td>\u003ctd class=\"num\">2,500\u003c/td>\u003ctd class=\"num\">-75%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cat / read\u003c/td>\u003ctd class=\"num\">40,000\u003c/td>\u003ctd class=\"num\">12,000\u003c/td>\u003ctd class=\"num\">-70%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cblockquote>\u003cp>\u003cstrong>说明\u003c/strong>：这张表混合了 token 和字符两种统计口径：前几行是 token，\u003ccode>vitest run\u003c/code> 这一行是字符长度，用来说明压缩幅度，不能和 token 行直接横向比较。另外，RTK 压的是\"命令输出送往上下文\"的量，它只是输入 Token 的一部分，且官方按 bytes/4 估算 token（百分比可靠、绝对数字近似）——所以账单的实际降幅会小于压缩率，它的价值是把最大的单点噪声一次性打掉。[8]\u003c/p>\u003c/blockquote>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-22\">\u003ch4 class=\"sec-title\">RTK 的四层过滤策略\u003c/h4>\u003col class=\"lst\">\u003cli>\u003cstrong>智能过滤\u003c/strong>：剔除注释、空行、ANSI 颜色码、进度条、无关警告\u003c/li>\u003cli>\u003cstrong>分组聚合\u003c/strong>：同类输出合并展示（搜索结果按文件分组、错误按类型归类）\u003c/li>\u003cli>\u003cstrong>智能截断\u003c/strong>：按信息密度取样，保留关键片段，砍掉重复长尾\u003c/li>\u003cli>\u003cstrong>去重合并\u003c/strong>：「连接超时」重复 10 次 → 「连接超时（×10）」\u003c/li>\u003c/ol>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-23\">\u003ch4 class=\"sec-title\">5 分钟安装\u003c/h4>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"# macOS（推荐）\nbrew install rtk\n\n# Linux / WSL\ncurl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh | sh\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode># macOS（推荐）\nbrew install rtk\n\n# Linux / WSL\ncurl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh | sh\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>\u003cstrong>注意\u003c/strong>：安装后用 \u003ccode>rtk gain\u003c/code> 验证节省面板能打开。如果命令不存在，可能装了同名的 Rust Type Kit，需卸载重装。[8]\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"# 按你用的 Agent 启用\nrtk init -g                    # Claude Code（默认）\nrtk init -g --codex            # Codex\nrtk init -g --gemini           # Gemini CLI\nrtk init -g --agent cursor     # Cursor\nrtk init -g --agent codebuddy  # CodeBuddy（Fork 版）\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode># 按你用的 Agent 启用\nrtk init -g                    # Claude Code（默认）\nrtk init -g --codex            # Codex\nrtk init -g --gemini           # Gemini CLI\nrtk init -g --agent cursor     # Cursor\nrtk init -g --agent codebuddy  # CodeBuddy（Fork 版）\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>重启 Agent 后自动生效，所有命令透明经过 RTK 过滤，开发者无感知。\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"# 常用命令\nrtk gain                 # 查看节省统计\nrtk gain --history       # 带命令历史\nrtk discover             # 扫描哪些命令还没用 RTK\n\n# Git（压缩率 60-80%）\nrtk git status\nrtk git diff\n\n# 测试（压缩率 90-99.6%）\nrtk test cargo test\nrtk vitest run\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode># 常用命令\nrtk gain                 # 查看节省统计\nrtk gain --history       # 带命令历史\nrtk discover             # 扫描哪些命令还没用 RTK\n\n# Git（压缩率 60-80%）\nrtk git status\nrtk git diff\n\n# 测试（压缩率 90-99.6%）\nrtk test cargo test\nrtk vitest run\u003c/code>\u003c/pre>\n    \u003c/div>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-24\">\u003ch3 class=\"sec-title\">4.2 Caveman：压缩输出端的废话\u003c/h3>\u003cp>RTK 压缩的是命令输出（输入 Token），Caveman 压缩的是 AI 回复（输出 Token）。两者方向不同，可以叠加。\u003c/p>\u003cp>\u003cstrong>核心数据\u003c/strong>（来自 arXiv:2604.00025）：[10][11]\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>任务类型\u003c/th>\u003cth>正常输出\u003c/th>\u003cth>Caveman\u003c/th>\u003cth>节省\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>解释 React bug\u003c/td>\u003ctd class=\"num\">118 tokens\u003c/td>\u003ctd class=\"num\">15 tokens\u003c/td>\u003ctd class=\"num\">\u003cstrong>87%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>配置 PostgreSQL\u003c/td>\u003ctd class=\"num\">234 tokens\u003c/td>\u003ctd class=\"num\">38 tokens\u003c/td>\u003ctd class=\"num\">\u003cstrong>84%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Docker 多阶段构建\u003c/td>\u003ctd class=\"num\">104 tokens\u003c/td>\u003ctd class=\"num\">29 tokens\u003c/td>\u003ctd class=\"num\">\u003cstrong>72%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Code Review PR\u003c/td>\u003ctd class=\"num\">67 tokens\u003c/td>\u003ctd class=\"num\">39 tokens\u003c/td>\u003ctd class=\"num\">\u003cstrong>41%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>平均\u003c/strong>\u003c/td>\u003ctd class=\"num\">—\u003c/td>\u003ctd class=\"num\">—\u003c/td>\u003ctd class=\"num\">\u003cstrong>65-75%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Caveman 有四种模式，按压缩程度递增：\u003c/p>\u003cul class=\"lst\">\u003cli>\u003ccode>/caveman lite\u003c/code>：删填充词，保留冠词，专业风格（适合正式输出）\u003c/li>\u003cli>\u003ccode>/caveman\u003c/code>（full 默认）：删冠词，碎片句，平衡压缩\u003c/li>\u003cli>\u003ccode>/caveman ultra\u003c/code>：极度压缩，用 \u003ccode>A→B→C\u003c/code> 箭头因果链\u003c/li>\u003cli>\u003ccode>/caveman wenyan\u003c/code>：文言文模式（理论上 token 效率最高的书面语）\u003c/li>\u003c/ul>\u003cp>\u003cstrong>实际效果示例\u003c/strong>（full 模式）：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"问：为什么 React 组件不断重渲染？\n\n普通输出（69 tokens）：\n&quot;The reason your React component is re-rendering is likely because you're\ncreating a new object reference on each render cycle...&quot;\n\nCaveman 输出（19 tokens）：\n&quot;New object ref each render. Inline object prop = new ref = re-render.\nWrap in useMemo.&quot;\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>问：为什么 React 组件不断重渲染？\n\n普通输出（69 tokens）：\n\"The reason your React component is re-rendering is likely because you're\ncreating a new object reference on each render cycle...\"\n\nCaveman 输出（19 tokens）：\n\"New object ref each render. Inline object prop = new ref = re-render.\nWrap in useMemo.\"\u003c/code>\u003c/pre>\n    \u003c/div>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-25\">\u003ch4 class=\"sec-title\">安装\u003c/h4>\u003cp>Caveman 官方目前还没有 CodeBuddy 支持，使用 \u003ca href=\"https://github.com/studyzy/caveman\" target=\"_blank\" rel=\"noopener\">studyzy Fork 版\u003c/a>（已增加 CodeBuddy 支持）：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"git clone https://github.com/studyzy/caveman\ncd caveman &amp;&amp; ./install.sh\n# 选中 [2] CodeBuddy 确定即可\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>git clone https://github.com/studyzy/caveman\ncd caveman &amp;&amp; ./install.sh\n# 选中 [2] CodeBuddy 确定即可\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>安装后在 CodeBuddy 里输入 \u003ccode>/caveman\u003c/code> 即可激活。模式在会话内持续生效，输入 \u003ccode>stop caveman\u003c/code> 关闭。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-26\">\u003ch3 class=\"sec-title\">4.3 headroom：压\"进上下文的所有内容\"\u003c/h3>\u003cp>RTK 压的是命令输出，Caveman 压的是 AI 回复。headroom 压的是第三个方向：\u003cstrong>所有读进上下文的内容\u003c/strong>——文件内容、工具调用返回值、会话历史。\u003c/p>\u003cp>\u003cstrong>核心机制\u003c/strong>：可逆压缩（CCR）。原始数据本地保留，压缩版本送给 LLM，LLM 需要细节时再按需取回。不是丢数据，是推迟加载。\u003c/p>\u003cp>headroom 不只是压缩器，它首先是代理层：Agent 不直接连 LLM，而是先经过本地的 headroom 代理入口，提示词、工具输出、日志、RAG 结果、文件等上下文都先在这里被接住、处理、再转发。代理层内部是一条处理流水线：\u003c/p>\u003cdiv class=\"flow-diagram\" data-reveal>\n    \u003cdiv class=\"flow-title\">headroom 代理层处理流水线\u003c/div>\n    \u003cdiv class=\"flow-h\">\n      \u003cdiv class=\"node\">Agent 所有上下文入口\u003c/div>\n      \u003cdiv class=\"arrow-h\">\u003c/div>\n      \u003cdiv class=\"node wrap\">CacheAligner\u003cbr>稳定前缀，帮助缓存命中\u003c/div>\n      \u003cdiv class=\"arrow-h\">\u003c/div>\n      \u003cdiv class=\"node wrap\">ContentRouter\u003cbr>按内容类型分流\u003c/div>\n      \u003cdiv class=\"arrow-v next\">\u003c/div>\n      \u003cdiv class=\"crushers\">\n        \u003cdiv class=\"node sm\">SmartCrusher（JSON）\u003c/div>\n        \u003cdiv class=\"node sm\">CodeCompressor（代码）\u003c/div>\n        \u003cdiv class=\"node sm\">base 压缩（一般文本）\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"arrow-h\">\u003c/div>\n      \u003cdiv class=\"node wrap\">CCR 可逆压缩\u003cbr>压缩版进上下文\u003c/div>\n      \u003cdiv class=\"arrow-h\">\u003c/div>\n      \u003cdiv class=\"node\">LLM\u003c/div>\n      \u003cdiv class=\"loopback\">\u003ci>\u003c/i>\u003cb>retrieve 按需取回细节\u003c/b>\u003c/div>\n    \u003c/div>\n  \u003c/div>\u003cp>CacheAligner 负责稳定前缀、帮 Prompt Cache 命中；ContentRouter 判断内容类型，把 JSON、代码、文本分别交给 SmartCrusher、CodeCompressor、base 压缩器；CCR 负责可逆压缩，原始数据全部保留在本地。\u003c/p>\u003cp>\u003cstrong>实测效果\u003c/strong>（真实 Agent 工作负载）：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>场景\u003c/th>\u003cth>压缩前\u003c/th>\u003cth>压缩后\u003c/th>\u003cth>节省\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>代码搜索（100 条结果）\u003c/td>\u003ctd class=\"num\">17,765\u003c/td>\u003ctd class=\"num\">1,408\u003c/td>\u003ctd class=\"num\">\u003cstrong>92%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SRE 故障排查\u003c/td>\u003ctd class=\"num\">65,694\u003c/td>\u003ctd class=\"num\">5,118\u003c/td>\u003ctd class=\"num\">\u003cstrong>92%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GitHub Issue 分类\u003c/td>\u003ctd class=\"num\">54,174\u003c/td>\u003ctd class=\"num\">14,761\u003c/td>\u003ctd class=\"num\">\u003cstrong>73%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>代码库探索\u003c/td>\u003ctd class=\"num\">78,502\u003c/td>\u003ctd class=\"num\">41,254\u003c/td>\u003ctd class=\"num\">\u003cstrong>47%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>更关键的是，压缩后的准确率没有下降。在 GSM8K（数学推理）、TruthfulQA（事实准确性）等标准基准上，压缩前后的得分基本持平甚至略优。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-27\">\u003ch4 class=\"sec-title\">安装与接入\u003c/h4>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"pip install &quot;headroom-ai[all]&quot;\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>pip install \"headroom-ai[all]\"\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>接入 CodeBuddy（用 \u003ca href=\"https://github.com/studyzy/headroom\" target=\"_blank\" rel=\"noopener\">studyzy Fork 版\u003c/a>，已增加 CodeBuddy 支持）：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"# 基础接入\nheadroom wrap codebuddy\n\n# 推荐：同时开启跨 session 记忆 + 代码图谱集成\nheadroom wrap codebuddy --memory --code-graph\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode># 基础接入\nheadroom wrap codebuddy\n\n# 推荐：同时开启跨 session 记忆 + 代码图谱集成\nheadroom wrap codebuddy --memory --code-graph\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>之后正常用 CodeBuddy，headroom 在后台透明处理压缩，无感知。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-28\">\u003ch4 class=\"sec-title\">也支持 MCP Server 模式\u003c/h4>\u003cp>如果不想用 wrap 方式，可以走 MCP：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"headroom mcp install\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>headroom mcp install\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>安装后在 CodeBuddy 里自动注册三个工具：\u003ccode>headroom_compress\u003c/code>、\u003ccode>headroom_retrieve\u003c/code>、\u003ccode>headroom_stats\u003c/code>。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-29\">\u003ch4 class=\"sec-title\">与 RTK 的区别\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>RTK\u003c/th>\u003cth>headroom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>压缩对象\u003c/td>\u003ctd class=\"num\">终端命令的输出\u003c/td>\u003ctd class=\"num\">所有进上下文的内容\u003c/td>\u003c/tr>\u003ctr>\u003ctd>工作方式\u003c/td>\u003ctd class=\"num\">过滤 + 截断\u003c/td>\u003ctd class=\"num\">可逆压缩 + 按类型路由 + 按需还原\u003c/td>\u003c/tr>\u003ctr>\u003ctd>安装方式\u003c/td>\u003ctd class=\"num\">brew / curl\u003c/td>\u003ctd class=\"num\">pip + wrap 命令\u003c/td>\u003c/tr>\u003ctr>\u003ctd>典型节省\u003c/td>\u003ctd class=\"num\">89%\u003c/td>\u003ctd class=\"num\">47–92%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>两者方向不同，可以叠加使用。如果只装一个，RTK 解决最大的单点问题（终端输出）；如果追求更全面的压缩覆盖，再加上 headroom。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-30\">\u003ch3 class=\"sec-title\">4.4 context-mode：工具输出不再撑爆上下文\u003c/h3>\u003cp>context-mode 解决的是一个具体痛点：\u003cstrong>MCP 工具调用的返回值太大\u003c/strong>。\u003c/p>\u003cp>一次 Playwright 快照 56 KB，二十条 GitHub issue 59 KB，一份访问日志 45 KB。用 30 分钟，40% 上下文就没了。然后 \u003ccode>/compact\u003c/code> 一压缩，CodeBuddy 忘了在改哪些文件、任务进行到哪了。\u003c/p>\u003cp>context-mode 是一个 MCP server 插件，四层能力一起上：\u003c/p>\u003cp>\u003cstrong>能力一：Sandbox 工具输出（98% 压缩）\u003c/strong>\u003c/p>\u003cp>工具调用结果先沙箱化，不直接进上下文。315 KB → 5.4 KB。LLM 按需取回原始数据，不是真的删掉。\u003c/p>\u003cp>\u003cstrong>能力二：跨 compact 会话连续性\u003c/strong>\u003c/p>\u003cp>所有文件编辑、git 操作、任务进度、错误信息全部记录到本地 SQLite。\u003ccode>/compact\u003c/code> 之后不丢失现场——context-mode 用 FTS5 全文索引按相关性取回，而不是把所有历史重新塞回去。\u003c/p>\u003cp>\u003cstrong>能力三：用代码代替读文件\u003c/strong>\u003c/p>\u003cp>\u003ccode>ctx_execute()\u003c/code> 工具让 Agent 写脚本处理数据，而不是读 50 个文件进上下文：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">javascript\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"// Before: 47 次 Read() = 700 KB\n// After: 1 次 ctx_execute() = 3.6 KB\nctx_execute(&quot;javascript&quot;, `\n  const files = fs.readdirSync('src').filter(f =&gt; f.endsWith('.ts'));\n  files.forEach(f =&gt; {\n    const lines = fs.readFileSync('src/' + f, 'utf8').split('\\n').length;\n    console.log(f + ': ' + lines + ' lines');\n  });\n`)\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>// Before: 47 次 Read() = 700 KB\n// After: 1 次 ctx_execute() = 3.6 KB\nctx_execute(\"javascript\", `\n  const files = fs.readdirSync('src').filter(f =&gt; f.endsWith('.ts'));\n  files.forEach(f =&gt; {\n    const lines = fs.readFileSync('src/' + f, 'utf8').split('\\n').length;\n    console.log(f + ': ' + lines + ' lines');\n  });\n`)\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>Agent 生成并运行脚本，只把结果（几行文字）放进上下文，而不是把 47 个文件的内容全部读进来。\u003c/p>\u003cp>\u003cstrong>能力四：不干预输出格式\u003c/strong>\u003c/p>\u003cp>context-mode 只管数据往哪走，不管 Agent 怎么回答。如果你同时装了 Caveman，两者各管各的，不冲突。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-31\">\u003ch4 class=\"sec-title\">安装\u003c/h4>\u003cp>CodeBuddy 使用 \u003ca href=\"https://github.com/studyzy/context-mode\" target=\"_blank\" rel=\"noopener\">studyzy Fork 版\u003c/a>（已增加 CodeBuddy 支持）：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"npm install -g context-mode\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>npm install -g context-mode\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>重启 CodeBuddy（或 \u003ccode>/reload-plugins\u003c/code>）后生效。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-32\">\u003ch4 class=\"sec-title\">验证与常用命令\u003c/h4>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"/context-mode:ctx-doctor    # 检查，所有项显示 [x] 即正常\n/context-mode:ctx-stats     # 查看节省统计，按工具分类\n/context-mode:ctx-insight   # 打开本地分析看板（90 个指标）\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>/context-mode:ctx-doctor    # 检查，所有项显示 [x] 即正常\n/context-mode:ctx-stats     # 查看节省统计，按工具分类\n/context-mode:ctx-insight   # 打开本地分析看板（90 个指标）\u003c/code>\u003c/pre>\n    \u003c/div>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-33\">\u003ch3 class=\"sec-title\">四个压缩工具一览\u003c/h3>\u003cp>工具互补，不互斥。从左到右压缩复杂度递增：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>工具\u003c/th>\u003cth>压缩什么\u003c/th>\u003cth>典型节省\u003c/th>\u003cth>装法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RTK\u003c/td>\u003ctd class=\"num\">终端命令输出 → 上下文\u003c/td>\u003ctd class=\"num\">89%\u003c/td>\u003ctd class=\"num\">\u003ccode>brew install rtk\u003c/code> + \u003ccode>rtk init -g\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Caveman\u003c/td>\u003ctd class=\"num\">AI 回复输出\u003c/td>\u003ctd class=\"num\">65–75%\u003c/td>\u003ctd class=\"num\">\u003ccode>install.sh\u003c/code>（CodeBuddy 用 Fork 版）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>headroom\u003c/td>\u003ctd class=\"num\">所有进上下文的内容\u003c/td>\u003ctd class=\"num\">47–92%\u003c/td>\u003ctd class=\"num\">\u003ccode>pip install \"headroom-ai[all]\"\u003c/code>（CodeBuddy 用 Fork 版）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>context-mode\u003c/td>\u003ctd class=\"num\">MCP 工具结果 + 会话连续性\u003c/td>\u003ctd class=\"num\">98%（工具输出）\u003c/td>\u003ctd class=\"num\">\u003ccode>npm install -g context-mode\u003c/code>（CodeBuddy 用 Fork 版）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>最低成本起点：先装 RTK + Caveman，五分钟，立即见效。有时间再评估 headroom 和 context-mode。\u003c/p>\u003c/section>\u003cheader class=\"chapter-head\" data-sec data-reveal>\n    \u003cspan class=\"eyebrow\">第 五 章\u003c/span>\n    \u003ch2 id=\"ch-5\" class=\"chapter-title\">代码图谱：让 AI 不再盲搜\u003c/h2>\n  \u003c/header>\u003cp>前一层压的是\"已经进来的东西\"。这一层解决的是另一类浪费：\u003cstrong>本来就不该读进来的东西。\u003c/strong>\u003c/p>\u003csection class=\"sec\" data-sec id=\"sec-34\">\u003ch3 class=\"sec-title\">5.1 真正贵的是\"找代码\"，不是\"读代码\"\u003c/h3>\u003cp>上下文窗口够大，不代表不需要图谱。\u003c/p>\u003cp>项目越大，AI 越容易陷入一个循环：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"grep 一圈找入口\n→ 读几个文件找关系\n→ 发现漏了一个\n→ 再 grep 一圈\n→ 反复几轮才定位到\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>grep 一圈找入口\n→ 读几个文件找关系\n→ 发现漏了一个\n→ 再 grep 一圈\n→ 反复几轮才定位到\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>这个过程消耗大量 Tool Call 和上下文，而且结果还不一定准确。\u003c/p>\u003cp>代码图谱解决的是：\u003cstrong>让 AI 在动手读文件之前，就知道该读哪里。\u003c/strong>\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-35\">\u003ch3 class=\"sec-title\">5.2 Graphify：把代码库变成可查询的知识地图\u003c/h3>\u003cp>Graphify 在 2026 年 4 月发布，10 天内 GitHub stars 超过 22k，如今已经超过 50.8k。\u003c/p>\u003cp>\u003cstrong>核心机制\u003c/strong>：用 Tree-sitter 解析代码构建知识图谱，AI 查图而不是反复读文件。\u003c/p>\u003cp>官方数据：\u003cstrong>比直接读文件减少 71.5 倍 Token 消耗\u003c/strong>。[12]\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-36\">\u003ch4 class=\"sec-title\">安装和使用\u003c/h4>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"# 安装\nuv tool install graphifyy\n# 或\npipx install graphifyy\n\n# 注册到 CodeBuddy\ngraphify install --platform codebuddy\n# 或\ngraphify codebuddy install\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode># 安装\nuv tool install graphifyy\n# 或\npipx install graphifyy\n\n# 注册到 CodeBuddy\ngraphify install --platform codebuddy\n# 或\ngraphify codebuddy install\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>在 CodeBuddy 里执行 \u003ccode>/graphify\u003c/code>，自动扫描项目并生成三份产物：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"&gt; /graphify\n\nBuilding knowledge graph...\n  Parsed 247 files (TS/Prisma)\n  Found 1,832 symbols, 4,217 edges\n  Detected 14 communities (clusters)\n  Generated:\n    - graphify-out/graph.html          ← 交互式可视化\n    - graphify-out/GRAPH_REPORT.md     ← 自然语言报告\n    - graphify-out/graph.json          ← AI 查询用的数据\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>&gt; /graphify\n\nBuilding knowledge graph...\n  Parsed 247 files (TS/Prisma)\n  Found 1,832 symbols, 4,217 edges\n  Detected 14 communities (clusters)\n  Generated:\n    - graphify-out/graph.html          ← 交互式可视化\n    - graphify-out/GRAPH_REPORT.md     ← 自然语言报告\n    - graphify-out/graph.json          ← AI 查询用的数据\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>后续问跨文件问题时，AI 读 \u003ccode>graphify-out/graph.json\u003c/code>，而不是反复 grep 源码：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"&gt; 我想在 /api/v1/comments 加一个 PATCH 接口。\n&gt; 列出会受到影响的所有中间件、Prisma model、和测试文件。\n\n影响分析（基于知识图谱）：\n\n中间件链：\n  - middleware/auth.ts → optionalAuth → requireAuth\n  - middleware/rate-limit.ts（commenting 路径 30/min 限制）\n\nPrisma model：\n  - Comment（直接修改）\n  - User（通过 authorId 关联）\n  - Mention（通过 commentId 关联，PATCH 后需要重算）\n\n测试：\n  - tests/comments.test.ts\n  - tests/integration/registration.test.ts（间接依赖）\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>&gt; 我想在 /api/v1/comments 加一个 PATCH 接口。\n&gt; 列出会受到影响的所有中间件、Prisma model、和测试文件。\n\n影响分析（基于知识图谱）：\n\n中间件链：\n  - middleware/auth.ts → optionalAuth → requireAuth\n  - middleware/rate-limit.ts（commenting 路径 30/min 限制）\n\nPrisma model：\n  - Comment（直接修改）\n  - User（通过 authorId 关联）\n  - Mention（通过 commentId 关联，PATCH 后需要重算）\n\n测试：\n  - tests/comments.test.ts\n  - tests/integration/registration.test.ts（间接依赖）\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>不用图谱时，同样问题经常要靠多轮 grep 和补读文件来兜底，遗漏关键路径并不少见。用图谱后，定位和影响分析会稳定得多，尤其适合跨文件问题。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-37\">\u003ch4 class=\"sec-title\">支持范围\u003c/h4>\u003cul class=\"lst\">\u003cli>\u003cstrong>30+ 种语言\u003c/strong>：Python、TypeScript、Go、Rust、Java、C/C++、Ruby、C#、Kotlin 等\u003c/li>\u003cli>\u003cstrong>多模态\u003c/strong>：SQL schema、Markdown 文档、PDF、图片（通过 LLM 提取语义）\u003c/li>\u003cli>\u003cstrong>增量更新\u003c/strong>：git hook 触发，每次 commit 自动重建\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-38\">\u003ch3 class=\"sec-title\">5.3 CodeGraph：持久化的图数据库方案\u003c/h3>\u003cp>CodeGraph 是另一个方向的工具，基于 MCP Server + 持久化图数据库（Neo4j/KuzuDB），对 7 个真实开源仓库做了完整 benchmark（2026-08 复测，Claude Opus 4.8，每仓 4 轮取中值）：[13]\u003c/p>\u003cp>\u003cstrong>平均数据\u003c/strong>：\u003cstrong>62% 更少 Token、88% 更少 Tool Call、44% 更低成本、53% 更快\u003c/strong>。\u003c/p>\u003cp>\u003cstrong>分仓库明细\u003c/strong>（有图 vs 无图，回答同一个架构问题）：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>代码库\u003c/th>\u003cth>语言\u003c/th>\u003cth>Token\u003c/th>\u003cth>工具调用\u003c/th>\u003cth>成本\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>VS Code\u003c/td>\u003ctd class=\"num\">TypeScript\u003c/td>\u003ctd class=\"num\">-77%\u003c/td>\u003ctd class=\"num\">2 vs 28\u003c/td>\u003ctd class=\"num\">-71%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Excalidraw\u003c/td>\u003ctd class=\"num\">TypeScript\u003c/td>\u003ctd class=\"num\">-84%\u003c/td>\u003ctd class=\"num\">2 vs 43\u003c/td>\u003ctd class=\"num\">-78%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Django\u003c/td>\u003ctd class=\"num\">Python\u003c/td>\u003ctd class=\"num\">-41%\u003c/td>\u003ctd class=\"num\">3 vs 14\u003c/td>\u003ctd class=\"num\">-13%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tokio\u003c/td>\u003ctd class=\"num\">Rust\u003c/td>\u003ctd class=\"num\">-65%\u003c/td>\u003ctd class=\"num\">3 vs 29\u003c/td>\u003ctd class=\"num\">-64%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OkHttp\u003c/td>\u003ctd class=\"num\">Java\u003c/td>\u003ctd class=\"num\">-54%\u003c/td>\u003ctd class=\"num\">1 vs 6\u003c/td>\u003ctd class=\"num\">-21%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gin\u003c/td>\u003ctd class=\"num\">Go\u003c/td>\u003ctd class=\"num\">-52%\u003c/td>\u003ctd class=\"num\">1 vs 7\u003c/td>\u003ctd class=\"num\">持平\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alamofire\u003c/td>\u003ctd class=\"num\">Swift\u003c/td>\u003ctd class=\"num\">-59%\u003c/td>\u003ctd class=\"num\">4 vs 33\u003c/td>\u003ctd class=\"num\">-57%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>诚实的一面\u003c/strong>：收益和项目规模、语言强相关。大型 Rust/TypeScript 项目收益最显著，中小 Java/Go 项目收益相对有限。而且官方明确承认：这些数字衡量的是\"处理量\"——过手的 token、花的钱、用的工具；\u003cstrong>不衡量会话结束时上下文里残留多少\u003c/strong>。长会话里，图返回的密集负载会留在上下文窗口，残留占用反而比\"grep+读文件\"式更高（7 个仓库平均约多 80%，VS Code 上是 67k vs 18k）。\"处理更少、残留更多\"同时成立，如果长期跑长 session，要为此留预算。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-39\">\u003ch4 class=\"sec-title\">CodeGraph 安装\u003c/h4>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"# npm 安装\nnpm i -g @colbymchenry/codegraph\n\n# 初始化项目\ncd your-project\ncodegraph init -i\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode># npm 安装\nnpm i -g @colbymchenry/codegraph\n\n# 初始化项目\ncd your-project\ncodegraph init -i\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>手动配置 CodeBuddy：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">json\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"// ~/.codebuddy/.mcp.json\n{\n  &quot;mcpServers&quot;: {\n    &quot;codegraph&quot;: {\n      &quot;type&quot;: &quot;stdio&quot;,\n      &quot;command&quot;: &quot;codegraph&quot;,\n      &quot;args&quot;: [&quot;serve&quot;, &quot;--mcp&quot;]\n    }\n  }\n}\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>// ~/.codebuddy/.mcp.json\n{\n  \"mcpServers\": {\n    \"codegraph\": {\n      \"type\": \"stdio\",\n      \"command\": \"codegraph\",\n      \"args\": [\"serve\", \"--mcp\"]\n    }\n  }\n}\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>核心工具：\u003c/p>\u003cul class=\"lst\">\u003cli>\u003ccode>codegraph_context\u003c/code>：找入口点和关键符号（第一跳）\u003c/li>\u003cli>\u003ccode>codegraph_trace\u003c/code>：追调用路径（含动态派发）\u003c/li>\u003cli>\u003ccode>codegraph_impact\u003c/code>：重构前影响分析\u003c/li>\u003c/ul>\u003cp>\u003cstrong>选哪个\u003c/strong>：个人项目、快速上手 → Graphify（Skill 形态，零配置）。团队、大型仓库、需要持久化查询 → CodeGraph（MCP 服务器，功能更完整）。\u003c/p>\u003c/section>\u003cheader class=\"chapter-head\" data-sec data-reveal>\n    \u003cspan class=\"eyebrow\">第 六 章\u003c/span>\n    \u003ch2 id=\"ch-6\" class=\"chapter-title\">多 Agent 协作：边界清晰时更省 Token\u003c/h2>\n  \u003c/header>\u003cp>前两层解决的是\"单个上下文怎么更省\"。这一层继续往前走：\u003cstrong>别让所有任务都挤进同一个上下文。\u003c/strong>\u003c/p>\u003cp>换句话说，前面讲的是\"单个会话怎么省\"，这里讲的是：\u003cstrong>多个 Agent 怎么分工协作，才能在任务边界清晰时更省。\u003c/strong>\u003c/p>\u003cp>CodeBuddy 本身就支持 subagent 调度、worktree 隔离、Skill 绑模型——不需要自己写 Orchestrator，用好内置能力就够了。\u003c/p>\u003csection class=\"sec\" data-sec id=\"sec-40\">\u003ch3 class=\"sec-title\">6.1 单 Agent 为什么越用越贵\u003c/h3>\u003cp>复杂项目里，单 session 很容易演变成这样：\u003c/p>\u003cul class=\"lst\">\u003cli>规划、写代码、跑测试、Code Review 全在一个会话\u003c/li>\u003cli>上下文越积越长（所有历史都往一个 session 里塞）\u003c/li>\u003cli>所有任务用同一个模型配置，便宜活也用最贵模型\u003c/li>\u003c/ul>\u003cp>\u003cstrong>职责越混，上下文越胖，成本越高。\u003c/strong>\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-41\">\u003ch3 class=\"sec-title\">6.2 subagent：任务隔离的最低成本方式\u003c/h3>\u003cp>CodeBuddy 的 Skill 里可以直接调用 Agent tool，把子任务分发出去：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"使用 Agent tool 分析这个 PR 的影响范围，\n然后把结果返回给我，不需要读具体实现文件。\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>使用 Agent tool 分析这个 PR 的影响范围，\n然后把结果返回给我，不需要读具体实现文件。\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>每个 subagent 都应该有独立的上下文边界——它只看到自己需要的内容，主 session 只看到结果。前提是子任务真的能拆开；如果每个 Agent 都要重复读同一批背景，拆得越多，反而越贵。\u003c/p>\u003cp>\u003cstrong>典型分工\u003c/strong>：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"主 session（规划 + 决策）\n  ├── subagent A：影响分析（只看图谱，不读源码）\n  ├── subagent B：写实现（只看相关文件）\n  └── subagent C：跑测试 + 生成报告\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>主 session（规划 + 决策）\n  ├── subagent A：影响分析（只看图谱，不读源码）\n  ├── subagent B：写实现（只看相关文件）\n  └── subagent C：跑测试 + 生成报告\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>与 3.5 的连接：subagent 可以单独绑定便宜模型。规划用强模型，执行用便宜模型，两者在不同 session 里，互不干扰。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-42\">\u003ch3 class=\"sec-title\">6.3 /new、/compact、subagent、worktree：四种手段别混用\u003c/h3>\u003cp>这四个动作都和\"上下文变轻\"有关，但解决的问题完全不同：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>手段\u003c/th>\u003cth>解决什么\u003c/th>\u003cth>历史怎么处理\u003c/th>\u003cth>代码改动怎么处理\u003c/th>\u003cth>适用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>/new\u003c/td>\u003ctd class=\"num\">切断无关任务\u003c/td>\u003ctd class=\"num\">直接开新会话\u003c/td>\u003ctd class=\"num\">仍在同一仓库\u003c/td>\u003ctd class=\"num\">换话题、换需求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/compact\u003c/td>\u003ctd class=\"num\">压长会话历史\u003c/td>\u003ctd class=\"num\">保留摘要，不保留完整过程\u003c/td>\u003ctd class=\"num\">仍在当前工作区\u003c/td>\u003ctd class=\"num\">长任务续做\u003c/td>\u003c/tr>\u003ctr>\u003ctd>subagent\u003c/td>\u003ctd class=\"num\">拆子任务\u003c/td>\u003ctd class=\"num\">只给子任务需要的上下文\u003c/td>\u003ctd class=\"num\">默认不做代码隔离\u003c/td>\u003ctd class=\"num\">搜索、分析、验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>worktree\u003c/td>\u003ctd class=\"num\">隔离并发改动\u003c/td>\u003ctd class=\"num\">历史不是重点\u003c/td>\u003ctd class=\"num\">独立 git worktree\u003c/td>\u003ctd class=\"num\">多任务并行开发\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>一句话：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"/new 解决换任务\n/compact 解决历史过长\nsubagent 解决职责拆分\nworktree 解决代码并发\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>/new 解决换任务\n/compact 解决历史过长\nsubagent 解决职责拆分\nworktree 解决代码并发\u003c/code>\u003c/pre>\n    \u003c/div>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-43\">\u003ch3 class=\"sec-title\">6.4 worktree 并发：多任务同时跑不冲突\u003c/h3>\u003cp>有一批互相独立的任务要处理（比如修 5 个不相关的 Bug），可以用 worktree 模式并发：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"主分支\n  ├── worktree-1：修 Bug A（独立 git worktree）\n  ├── worktree-2：修 Bug B（独立 git worktree）\n  └── worktree-3：修 Bug C（独立 git worktree）\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>主分支\n  ├── worktree-1：修 Bug A（独立 git worktree）\n  ├── worktree-2：修 Bug B（独立 git worktree）\n  └── worktree-3：修 Bug C（独立 git worktree）\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>每个 Agent 在隔离的 worktree 里工作，改的是不同文件，互不冲突。\u003c/p>\u003cp>\u003cstrong>怎么开\u003c/strong>：在 CodeBuddy 里启动新任务时，指定 worktree 隔离：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"开一个新的 worktree 分支修这个 Bug，\n修完后告诉我分支名，我来 review 再合并。\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>开一个新的 worktree 分支修这个 Bug，\n修完后告诉我分支名，我来 review 再合并。\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>\u003cstrong>怎么合\u003c/strong>：worktree 没改动自动清理；有改动返回路径和分支名，自己决定 review 后合并。\u003c/p>\u003cp>\u003cstrong>适用场景\u003c/strong>：互相独立的 Bug 修复、并行跑不同重构方案对比效果、同时生成多个文档。\u003c/p>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-44\">\u003ch3 class=\"sec-title\">6.5 Orchestrator-Worker 模式：把多 Agent 协作变成工程\u003c/h3>\u003cp>前面几节讲的是\"怎么给单个 Agent 减负\"。这一节讲更进一步的思路：\u003cstrong>用 Orchestrator-Worker 模式，把一个臃肿的长任务变成一个有分工的流水线。\u003c/strong>\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"Orchestrator（协调器 Agent）\n  ├── 负责规划、拆解、调度、汇总\n  ├── 不亲自读大量文件，不亲自跑命令\n  └── 只负责决策\n\nWorker（子 Agent，按需派遣）\n  ├── 每个 Worker 只做一件事\n  ├── 只看自己需要的上下文\n  └── 做完了把结果交回\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>Orchestrator（协调器 Agent）\n  ├── 负责规划、拆解、调度、汇总\n  ├── 不亲自读大量文件，不亲自跑命令\n  └── 只负责决策\n\nWorker（子 Agent，按需派遣）\n  ├── 每个 Worker 只做一件事\n  ├── 只看自己需要的上下文\n  └── 做完了把结果交回\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>为什么这个模式能省 Token？\u003c/p>\u003cp>一个单 Agent 处理复杂任务时，它必须同时承载规划、代码阅读、工具调用、生成、验证的所有上下文——哪怕它当前正在做的只是\"改一个函数\"。Orchestrator-Worker 模式的本质，是\u003cstrong>让每个 Agent 只看和当前步骤相关的内容\u003c/strong>，而不是把整个任务的所有背景都塞进每一次调用。\u003c/p>\u003cp>一个典型的成本对比：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"单 Agent 全程跑：\n  System Prompt(5K) + 历史(120K) + 规划(10K) + 代码(50K) + 工具结果(30K)\n  = 215K tokens × N 轮\n\nOrchestrator + Worker 分工：\n  Orchestrator 轮次：System Prompt(5K) + 任务状态(2K) + 规划(3K) = 10K tokens\n  Worker A 轮次：目标(1K) + 相关文件(8K) + 工具结果(5K) = 14K tokens\n  Worker B 轮次：目标(1K) + 测试文件(6K) + 前步结果(3K) = 10K tokens\n\n  同样完成任务，每轮成本压缩 5-10 倍\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>单 Agent 全程跑：\n  System Prompt(5K) + 历史(120K) + 规划(10K) + 代码(50K) + 工具结果(30K)\n  = 215K tokens × N 轮\n\nOrchestrator + Worker 分工：\n  Orchestrator 轮次：System Prompt(5K) + 任务状态(2K) + 规划(3K) = 10K tokens\n  Worker A 轮次：目标(1K) + 相关文件(8K) + 工具结果(5K) = 14K tokens\n  Worker B 轮次：目标(1K) + 测试文件(6K) + 前步结果(3K) = 10K tokens\n\n  同样完成任务，每轮成本压缩 5-10 倍\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>具体分工的一个真实例子——\"修复 API 层 Bug + 补测试 + 写变更说明\"：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"Orchestrator（强模型）\n  ├── 分析任务，生成工作计划到 .agent/plan.json\n  ├── 派出 Worker A：定位 Bug（只给图谱和入口文件）\n  ├── 派出 Worker B：修复代码（只给有 Bug 的那几个文件）\n  ├── 派出 Worker C：补单测（只给修复后的文件 + 现有测试）\n  └── 派出 Worker D：写 changelog（只给 git diff + 模板）\n\n每个 Worker：\n  - 独立上下文，完成即销毁\n  - 绑定便宜模型（如 DeepSeek）\n  - 并行执行（C 和 D 可以同时跑）\n  - 结果写入共享文件，Orchestrator 汇总\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>Orchestrator（强模型）\n  ├── 分析任务，生成工作计划到 .agent/plan.json\n  ├── 派出 Worker A：定位 Bug（只给图谱和入口文件）\n  ├── 派出 Worker B：修复代码（只给有 Bug 的那几个文件）\n  ├── 派出 Worker C：补单测（只给修复后的文件 + 现有测试）\n  └── 派出 Worker D：写 changelog（只给 git diff + 模板）\n\n每个 Worker：\n  - 独立上下文，完成即销毁\n  - 绑定便宜模型（如 DeepSeek）\n  - 并行执行（C 和 D 可以同时跑）\n  - 结果写入共享文件，Orchestrator 汇总\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>在 CodeBuddy 里，这个模式可以通过 Agent tool 直接实现——Orchestrator 在主 Skill 或会话里运行，通过 Agent tool 分发子任务：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"使用 Agent tool 执行以下子任务，上下文独立，不需要继承当前历史：\n\n目标：定位 src/api/order.go 里的 CreateOrder Bug\n上下文：只读 src/api/order.go 和 src/model/order.go\n输出：把 Bug 描述和文件行号写入 .agent/findings.md\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>使用 Agent tool 执行以下子任务，上下文独立，不需要继承当前历史：\n\n目标：定位 src/api/order.go 里的 CreateOrder Bug\n上下文：只读 src/api/order.go 和 src/model/order.go\n输出：把 Bug 描述和文件行号写入 .agent/findings.md\u003c/code>\u003c/pre>\n    \u003c/div>\u003c/section>\u003csection class=\"sec\" data-sec id=\"sec-45\">\u003ch3 class=\"sec-title\">6.6 上下文隔离之后，数据怎么流转\u003c/h3>\u003cp>这是 Orchestrator-Worker 模式最绕不开的问题：\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>上下文既然隔离了，Agent 之间怎么传递信息？\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>答案：\u003cstrong>通过共享外置文件，不通过会话历史。\u003c/strong>\u003c/p>\u003cp>会话历史是每个 Agent 私有的，不同 Agent 的历史无法互通。但文件系统是共享的。这意味着上下文隔离和信息共享可以同时成立：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"Agent A 完成工作\n  → 把结果写入文件（.agent/step1_result.json）\n  → 上下文销毁\n\nAgent B 开始工作\n  → 读取文件（.agent/step1_result.json）\n  → 只看这个文件，不看 A 的历史\n  → 把自己的结果写入 .agent/step2_result.json\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>Agent A 完成工作\n  → 把结果写入文件（.agent/step1_result.json）\n  → 上下文销毁\n\nAgent B 开始工作\n  → 读取文件（.agent/step1_result.json）\n  → 只看这个文件，不看 A 的历史\n  → 把自己的结果写入 .agent/step2_result.json\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>这个模式有几个关键设计原则。\u003c/p>\u003cp>\u003cstrong>原则一：输出格式要结构化。\u003c/strong>\u003c/p>\u003cp>自然语言在 Agent 之间传递时容易产生歧义，也难以精确定位所需信息。结构化的 JSON 更紧凑、更可靠，下游 Agent 只需要读它关心的字段：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">json\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"// .agent/findings.json\n{\n  &quot;task&quot;: &quot;locate-bug&quot;,\n  &quot;status&quot;: &quot;completed&quot;,\n  &quot;findings&quot;: [\n    {\n      &quot;file&quot;: &quot;src/api/order.go&quot;,\n      &quot;line&quot;: 142,\n      &quot;issue&quot;: &quot;并发场景下 inventory.Lock() 未释放&quot;,\n      &quot;severity&quot;: &quot;high&quot;\n    }\n  ],\n  &quot;next_step&quot;: &quot;fix-bug&quot;,\n  &quot;context_needed&quot;: [&quot;src/api/order.go:120-165&quot;, &quot;src/model/inventory.go:30-55&quot;]\n}\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>// .agent/findings.json\n{\n  \"task\": \"locate-bug\",\n  \"status\": \"completed\",\n  \"findings\": [\n    {\n      \"file\": \"src/api/order.go\",\n      \"line\": 142,\n      \"issue\": \"并发场景下 inventory.Lock() 未释放\",\n      \"severity\": \"high\"\n    }\n  ],\n  \"next_step\": \"fix-bug\",\n  \"context_needed\": [\"src/api/order.go:120-165\", \"src/model/inventory.go:30-55\"]\n}\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>下游 Agent 收到的指令里只需要包含：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"读取 .agent/findings.json，针对其中的 findings 数组修复代码。\n修复完成后将结果写入 .agent/fix_result.json，格式参考 .agent/findings.json。\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>读取 .agent/findings.json，针对其中的 findings 数组修复代码。\n修复完成后将结果写入 .agent/fix_result.json，格式参考 .agent/findings.json。\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>\u003cstrong>原则二：用进度文件追踪状态。\u003c/strong>\u003c/p>\u003cp>复杂任务里，Orchestrator 需要知道每个步骤是否完成、是否失败、是否需要重试。这个状态本身也应该外置：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">json\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"// .agent/progress.json\n{\n  &quot;task_id&quot;: &quot;fix-order-bug-20260609&quot;,\n  &quot;created_at&quot;: &quot;2026-06-09T10:00:00Z&quot;,\n  &quot;steps&quot;: [\n    {\n      &quot;id&quot;: &quot;step-1-locate&quot;,\n      &quot;status&quot;: &quot;completed&quot;,\n      &quot;worker&quot;: &quot;investigator&quot;,\n      &quot;output_file&quot;: &quot;.agent/findings.json&quot;,\n      &quot;completed_at&quot;: &quot;2026-06-09T10:02:30Z&quot;\n    },\n    {\n      &quot;id&quot;: &quot;step-2-fix&quot;,\n      &quot;status&quot;: &quot;in_progress&quot;,\n      &quot;worker&quot;: &quot;implementer&quot;,\n      &quot;started_at&quot;: &quot;2026-06-09T10:02:35Z&quot;\n    },\n    {\n      &quot;id&quot;: &quot;step-3-test&quot;,\n      &quot;status&quot;: &quot;pending&quot;,\n      &quot;depends_on&quot;: &quot;step-2-fix&quot;\n    }\n  ]\n}\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode>// .agent/progress.json\n{\n  \"task_id\": \"fix-order-bug-20260609\",\n  \"created_at\": \"2026-06-09T10:00:00Z\",\n  \"steps\": [\n    {\n      \"id\": \"step-1-locate\",\n      \"status\": \"completed\",\n      \"worker\": \"investigator\",\n      \"output_file\": \".agent/findings.json\",\n      \"completed_at\": \"2026-06-09T10:02:30Z\"\n    },\n    {\n      \"id\": \"step-2-fix\",\n      \"status\": \"in_progress\",\n      \"worker\": \"implementer\",\n      \"started_at\": \"2026-06-09T10:02:35Z\"\n    },\n    {\n      \"id\": \"step-3-test\",\n      \"status\": \"pending\",\n      \"depends_on\": \"step-2-fix\"\n    }\n  ]\n}\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>Orchestrator 每次唤醒时，只需要读这一个文件就能知道任务进展，不需要回放任何 Agent 的历史会话。\u003c/p>\u003cp>\u003cstrong>原则三：每个 Worker 的 context 包精心裁剪。\u003c/strong>\u003c/p>\u003cp>新开一个 Worker 时，Orchestrator 应该明确告诉它\"只读哪些东西\"，而不是让 Worker 自己去探索：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"# Orchestrator 派遣 Worker 时的指令模板\n\n任务：为 CreateOrder 修复编写单元测试\n上下文：\n  - 修复内容：读 .agent/fix_result.json 中的 diff 字段\n  - 现有测试风格：读 src/api/order_test.go（前50行）\n  - 不需要读其他文件\n\n输出：\n  - 新增测试写入 src/api/order_test.go\n  - 把测试覆盖情况写入 .agent/test_result.json\n\n约束：\n  - 只修改 order_test.go，不动其他文件\n  - 测试不超过 80 行\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cspan>Copy\u003c/span>\u003c/button>\u003c/div>\n      \u003cpre>\u003ccode># Orchestrator 派遣 Worker 时的指令模板\n\n任务：为 CreateOrder 修复编写单元测试\n上下文：\n  - 修复内容：读 .agent/fix_result.json 中的 diff 字段\n  - 现有测试风格：读 src/api/order_test.go（前50行）\n  - 不需要读其他文件\n\n输出：\n  - 新增测试写入 src/api/order_test.go\n  - 把测试覆盖情况写入 .agent/test_result.json\n\n约束：\n  - 只修改 order_test.go，不动其他文件\n  - 测试不超过 80 行\u003c/code>\u003c/pre>\n    \u003c/div>\u003cp>这个指令本身很短（约 150 tokens），但它让 Worker 的上下文精准到最小必要集合。\u003c/p>\u003cp>\u003cstrong>原则四：临时文件及时清理。\u003c/strong>\u003c/p>\u003cp>\u003ccode>.agent/\u003c/code> 目录是临时工作区，任务完成后可以归档或删除：\u003c/p>\u003cdiv class=\"code-block\" data-reveal>\n      \u003cdiv class=\"code-head\">\u003cspan class=\"code-lang\">text\u003c/span>\n      \u003cbutton class=\"copy-btn\" data-copy=\"# 任务完成后归档\nmv .agent/ .agent-archive/fix-order-bug-20260609/\n\n# 或直接清理\nrm -rf .agent/\" aria-label=\"复制代码\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u
