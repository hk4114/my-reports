<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="20" y="30" fill="#94a3b8" font-size="11" font-weight="600">Skill / MCP / 自动化 / Goals 决策树</text>

  <!-- Start -->
  <rect x="330" y="50" width="240" height="44" rx="22" fill="#0f172a"/>
  <rect x="330" y="50" width="240" height="44" rx="22" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="450" y="77" fill="white" font-size="12" font-weight="600" text-anchor="middle">你想解决什么问题？</text>

  <!-- Arrow down -->
  <line x1="450" y1="94" x2="450" y2="130" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- Decision: Repeat workflow? -->
  <polygon points="450,130 520,170 450,210 380,170" fill="#0f172a"/>
  <polygon points="450,130 520,170 450,210 380,170" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="450" y="168" fill="white" font-size="10" font-weight="600" text-anchor="middle">重复工作流？</text>
  <text x="450" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">固定格式输出</text>

  <!-- Yes -> Skill -->
  <line x1="380" y1="170" x2="180" y2="170" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="300" y="163" fill="#34d399" font-size="9" font-weight="500">是</text>

  <rect x="20" y="140" width="160" height="70" rx="6" fill="#0f172a"/>
  <rect x="20" y="140" width="160" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="100" y="168" fill="white" font-size="11" font-weight="600" text-anchor="middle">Skill</text>
  <text x="100" y="186" fill="#94a3b8" font-size="9" text-anchor="middle">流程模板 + 工具包</text>
  <text x="100" y="202" fill="#34d399" font-size="8" text-anchor="middle">先跑通再沉淀</text>

  <!-- No -> External tool? -->
  <line x1="450" y1="210" x2="450" y2="250" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="462" y="235" fill="#fb7185" font-size="9" font-weight="500">否</text>

  <polygon points="450,250 520,290 450,330 380,290" fill="#0f172a"/>
  <polygon points="450,250 520,290 450,330 380,290" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="450" y="288" fill="white" font-size="10" font-weight="600" text-anchor="middle">连接外部工具？</text>
  <text x="450" y="300" fill="#94a3b8" font-size="8" text-anchor="middle">数据库 / 知识库 / 服务</text>

  <!-- Yes -> MCP -->
  <line x1="520" y1="290" x2="700" y2="290" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="580" y="283" fill="#34d399" font-size="9" font-weight="500">是</text>

  <rect x="700" y="260" width="180" height="70" rx="6" fill="#0f172a"/>
  <rect x="700" y="260" width="180" height="70" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="790" y="288" fill="white" font-size="11" font-weight="600" text-anchor="middle">MCP</text>
  <text x="790" y="306" fill="#94a3b8" font-size="9" text-anchor="middle">外部工具连接协议</text>
  <text x="790" y="322" fill="#22d3ee" font-size="8" text-anchor="middle">给官方链接安装</text>

  <!-- No -> Scheduled? -->
  <line x1="450" y1="330" x2="450" y2="370" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="462" y="355" fill="#fb7185" font-size="9" font-weight="500">否</text>

  <polygon points="450,370 520,410 450,450 380,410" fill="#0f172a"/>
  <polygon points="450,370 520,410 450,450 380,410" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="450" y="408" fill="white" font-size="10" font-weight="600" text-anchor="middle">定时触发？</text>
  <text x="450" y="420" fill="#94a3b8" font-size="8" text-anchor="middle">日报 / 周报 / 例行</text>

  <!-- Yes -> 自动化 -->
  <line x1="380" y1="410" x2="180" y2="410" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="300" y="403" fill="#34d399" font-size="9" font-weight="500">是</text>

  <rect x="20" y="380" width="160" height="70" rx="6" fill="#0f172a"/>
  <rect x="20" y="380" width="160" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="100" y="408" fill="white" font-size="11" font-weight="600" text-anchor="middle">自动化</text>
  <text x="100" y="426" fill="#94a3b8" font-size="9" text-anchor="middle">定时执行工作流</text>
  <text x="100" y="442" fill="#fbbf24" font-size="8" text-anchor="middle">只生成草稿不发布</text>

  <!-- No -> Goals -->
  <line x1="450" y1="450" x2="450" y2="490" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="462" y="475" fill="#fb7185" font-size="9" font-weight="500">否</text>

  <rect x="350" y="490" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="350" y="490" width="200" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="450" y="515" fill="white" font-size="11" font-weight="600" text-anchor="middle">Goals</text>
  <text x="450" y="533" fill="#94a3b8" font-size="9" text-anchor="middle">长期任务 + 明确完成标准</text>
  <text x="450" y="547" fill="#a78bfa" font-size="8" text-anchor="middle">必须有验证器</text>

  <!-- Legend -->
  <rect x="700" y="380" width="180" height="110" rx="6" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="715" y="405" fill="#94a3b8" font-size="9" font-weight="600">核心区别</text>
  <text x="715" y="425" fill="#34d399" font-size="9">Skill = 怎么做</text>
  <text x="715" y="442" fill="#22d3ee" font-size="9">MCP = 连什么</text>
  <text x="715" y="459" fill="#fbbf24" font-size="9">自动化 = 什么时候做</text>
  <text x="715" y="476" fill="#a78bfa" font-size="9">Goals = 做到什么程度</text>
</svg>
