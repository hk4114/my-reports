<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="20" y="30" fill="#94a3b8" font-size="11" font-weight="600">Browser / Chrome / Computer Use 决策树</text>

  <!-- Start -->
  <rect x="300" y="50" width="200" height="44" rx="22" fill="#0f172a"/>
  <rect x="300" y="50" width="200" height="44" rx="22" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="400" y="77" fill="white" font-size="12" font-weight="600" text-anchor="middle">需要操作网页或桌面 App？</text>

  <!-- Arrow down -->
  <line x1="400" y1="94" x2="400" y2="130" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- Decision 1: Web or Desktop -->
  <polygon points="400,130 460,165 400,200 340,165" fill="#0f172a"/>
  <polygon points="400,130 460,165 400,200 340,165" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="170" fill="white" font-size="10" font-weight="600" text-anchor="middle">操作网页？</text>

  <!-- Yes: Web -->
  <line x1="400" y1="200" x2="400" y2="240" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="412" y="225" fill="#34d399" font-size="9" font-weight="500">是</text>

  <!-- No: Desktop -> Computer Use -->
  <line x1="460" y1="165" x2="640" y2="165" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="500" y="158" fill="#fb7185" font-size="9" font-weight="500">否</text>

  <rect x="640" y="135" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="640" y="135" width="140" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="710" y="160" fill="white" font-size="11" font-weight="600" text-anchor="middle">Computer Use</text>
  <text x="710" y="178" fill="#94a3b8" font-size="9" text-anchor="middle">桌面图形界面</text>
  <text x="710" y="192" fill="#fb7185" font-size="8" text-anchor="middle">风险最高</text>

  <!-- Decision 2: Need login? -->
  <polygon points="400,240 460,275 400,310 340,275" fill="#0f172a"/>
  <polygon points="400,240 460,275 400,310 340,275" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="272" fill="white" font-size="10" font-weight="600" text-anchor="middle">需要登录态？</text>
  <text x="400" y="284" fill="#94a3b8" font-size="8" text-anchor="middle">Gmail / 公司后台</text>

  <!-- No: Browser -->
  <line x1="340" y1="275" x2="180" y2="275" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="280" y="268" fill="#34d399" font-size="9" font-weight="500">否</text>

  <rect x="20" y="245" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="20" y="245" width="160" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="100" y="270" fill="white" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
  <text x="100" y="288" fill="#94a3b8" font-size="9" text-anchor="middle">应用内浏览器</text>
  <text x="100" y="302" fill="#34d399" font-size="8" text-anchor="middle">首选 · 轻量安全</text>

  <!-- Yes: Chrome -->
  <line x1="400" y1="310" x2="400" y2="350" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="412" y="335" fill="#fb7185" font-size="9" font-weight="500">是</text>

  <rect x="300" y="350" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="300" y="350" width="200" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="400" y="375" fill="white" font-size="11" font-weight="600" text-anchor="middle">Chrome</text>
  <text x="400" y="393" fill="#94a3b8" font-size="9" text-anchor="middle">使用真实浏览器登录态</text>
  <text x="400" y="407" fill="#22d3ee" font-size="8" text-anchor="middle">需要已登录的网站</text>

  <!-- Summary box -->
  <rect x="20" y="440" width="760" height="60" rx="8" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="40" y="468" fill="#94a3b8" font-size="10" font-weight="600">决策口诀：</text>
  <text x="40" y="486" fill="#cbd5e1" font-size="11">能 Browser 不 Chrome，能 Chrome 不 Computer Use · 本地预览用 Browser · 已登录网站用 Chrome · 桌面 App 用 Computer Use（授权前看清范围）</text>
</svg>
